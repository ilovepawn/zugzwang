[project]
name = "zugzwang"
version = "0.1.0"
description = "Endgame trainer API powered by Syzygy tablebase"
authors = [
    {name = "ilovepawn"}
]
license = "GPL-3.0-or-later"
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "python-chess (>=1.999,<2.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "cryptography (>=47.0.0,<48.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
