name: ilovepawn-zugzwang

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./syzygy:/app/syzygy
    environment:
      - DATABASE_URL=mysql+pymysql://zugzwang:zugzwang@db:3306/zugzwang
      - SYZYGY_PATH=syzygy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ilovepawn-net
    restart: unless-stopped

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zugzwang
      MYSQL_USER: zugzwang
      MYSQL_PASSWORD: zugzwang
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ilovepawn-net

volumes:
  mysql_data:

networks:
  ilovepawn-net:
    external: true
